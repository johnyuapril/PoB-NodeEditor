<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoB 노드 편집기</title>
<style>
:root {
  --bg: #0b0d10; --grid: #2a2c31; --panel: #12151a; --card: #1b1e23; --card-h: #23272e; --line: #2c313a;
  --text: #e6e8eb; --dim: #8a919c; --accent: #6aa3ff; --ok: #4cc38a; --bad: #ef6b6b; --warn: #e5b94e; --cut: #555b66;
  --skill: #6aa3ff; --support: #9b8cff; --unique: #e59b4e; --rare: #d8c25a; --passive: #4cc3b5; --asc: #e56ab4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
#top { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top textarea { width: 260px; height: 32px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; }
button, select, input { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
button:hover { background: var(--card-h); cursor: pointer; }
button.primary { background: #24406b; border-color: #335a95; }
#stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; min-width: 86px; }
.stat .k { color: var(--dim); font-size: 11px; }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 11px; font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: var(--bad); }
#main { display: grid; grid-template-columns: 300px 1fr 300px; min-height: 0; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; min-height: 0; }
#right { border-right: 0; border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.tabs button.on { background: #24406b; border-color: #335a95; }
.row { display: flex; gap: 4px; margin-bottom: 6px; }
.row > * { flex: 1; min-width: 0; }
.item { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px; margin-bottom: 6px; }
.item .t { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.item .n { font-weight: 600; }
.item .s { color: var(--dim); font-size: 11px; white-space: pre-line; margin-top: 2px; }
.chip { font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.kind { font-size: 10px; padding: 0 5px; border-radius: 3px; color: #000; font-weight: 600; }
#canvas { position: relative; overflow: hidden; cursor: grab; min-height: 0;
  background-color: #1e1f22;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke-width: 2; pointer-events: stroke; cursor: pointer; }
.card { position: absolute; background: #24272d; border: 1px solid #0e0f12; border-radius: 6px; user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,.55); }
.card.pill { border-radius: 16px; }
.card.off { opacity: .4; }
.card.sel { outline: 3px solid #ff5a3d; outline-offset: 1px; }
.card .h { display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: move; border-radius: 6px 6px 0 0; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.card .h.pillh { border-radius: 16px; padding: 0 12px; }
.card .h .glyph { font-weight: 700; opacity: .9; }
.card .h .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.card .h .tag { font-size: 10px; opacity: .75; white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
.card .h button { padding: 0 4px; font-size: 10px; background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.15); color: #fff; }
.ports { position: relative; padding-bottom: 4px; }
.socks { padding-top: 3px; border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 3px; }
.srow { font-size: 11px; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow.empty { color: #666; cursor: pointer; font-style: italic; }
.srow.empty:hover { color: #aaa; }
.dot.guess { border-style: dashed; background: transparent !important; }
.dot.local { border-radius: 2px; transform: rotate(45deg) scale(.85); }
.selfmark { font-style: normal; font-size: 9px; color: #ddd; background: rgba(255,255,255,.12); border-radius: 3px; padding: 0 3px; margin-left: 3px; }
.dot.sock { border-radius: 3px; cursor: pointer; }
.prow { display: flex; justify-content: space-between; font-size: 11px; padding: 0 12px; }
.prow span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 62%; cursor: pointer; }
.prow span:hover { text-decoration: underline; }
.dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid; cursor: crosshair; box-sizing: border-box; }
.small { color: var(--dim); font-size: 11px; }
h3 { margin: 10px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.portrow { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.portrow .pn { flex: 1; }
.sw { width: 34px; height: 18px; border-radius: 9px; background: var(--cut); position: relative; cursor: pointer; border: 0; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .12s; }
.sw.on { background: var(--ok); } .sw.on::after { left: 18px; }
#busy { position: fixed; right: 12px; bottom: 10px; background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 6px; display: none; }
#msg { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: #3a1e1e; border: 1px solid #6b2c2c; padding: 6px 12px; border-radius: 6px; display: none; max-width: 70vw; }
#updBtn.has { background: #2e7d32; border-color: #4caf50; color: #fff; animation: updPulse 1.6s ease-in-out infinite; }
@keyframes updPulse { 50% { box-shadow: 0 0 10px #4caf50; } }
#export { width: 100%; height: 60px; font-size: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <strong>PoB 노드 편집기</strong>
    <select id="examples"><option value="">예시 빌드…</option></select>
    <select id="mainSkill" title="주 스킬 (PoB의 주 스킬 선택과 같음)"></select>
    <textarea id="code" placeholder="PoB 빌드 코드 붙여넣기"></textarea>
    <button class="primary" id="load">불러오기</button>
    <label class="small"><input type="checkbox" id="showCommon" checked> 상황 조건도 표시</label>
    <label class="small"><input type="checkbox" id="hideBare" checked> 연결 없는 카드 숨기기</label>
    <label class="small" title="치명타 확률, 치명타 피해 보너스, 속도처럼 전체에 적용되는 능력치를 '전역 효과' 카드로 모아 봅니다"><input type="checkbox" id="showStats" checked> 전역 효과</label>
    <label class="small" title="PoB가 해석하지 못한 문장에서 단어로 읽은 연결(점선)을 숨깁니다"><input type="checkbox" id="hideGuess"> 추정 연결 숨기기</label><span class="small" id="hiddenInfo"></span>
    <button id="updBtn" title="새 버전이 있으면 받아서 바로 적용합니다">업데이트</button>
    <div id="stats"></div>
  </div>
  <div id="main">
    <div class="side" id="left">
      <div class="tabs" id="tabs">
        <button data-t="port" class="on">연결</button><button data-t="passive">패시브</button><button data-t="unique">고유템</button><button data-t="gem">보조젬</button>
      </div>
      <div id="palette"></div>
    </div>
    <div id="canvas"><div id="world"><svg id="wires"></svg></div></div>
    <div class="side" id="right">
      <h3>연결 상태</h3>
      <div class="small">선 = PoB 설정. 생산자가 있으면 켜지고, 끄면 그 조건이 없는 상태로 계산합니다.</div>
      <div id="portList"></div>
      <h3>순환 고리</h3>
      <div id="cycles" class="small"></div>
      <h3>선택한 노드</h3>
      <div id="detail" class="small">노드를 누르면 내용이 보입니다.</div>
      <h3>내보내기</h3>
      <button id="exportBtn">PoB 코드 만들기</button>
      <textarea id="export" readonly></textarea>
    </div>
  </div>
</div>
<div id="busy">계산 중…</div>
<div id="msg"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const W = 240, ROW = 18, HEAD = 34;
let G = { ports: {}, entities: {} };
let KO = { names: {}, nodes: {}, uniq: {}, tmpl: {}, ports: {} };
const NUMRX = /\(?-?\d+(?:\.\d+)?(?:[—\-–]\d+(?:\.\d+)?)?\)?/g;
function T(en) {
  if (!en) return "";
  if (KO.names[en]) return KO.names[en];
  const m = /^(Jewel|Charm|Flask) ?(\d*)$/.exec(en);
  if (m) return ({ Jewel: "주얼", Charm: "호신부", Flask: "플라스크" })[m[1]] + (m[2] ? " " + m[2] : "");
  return en;
}                  // name -> Korean client name
function PN(p) { return KO.ports[p] || (G.ports[p] && G.ports[p].kr) || p; } // port -> Korean term
function NN(id, en) { const n = KO.nodes[String(id)]; return n ? n.n : T(en); }
function TL(line) {                                                            // one mod line -> Korean
  if (!line) return "";
  const nums = line.match(NUMRX) || [];
  const t = KO.tmpl[line.replace(NUMRX, "#").trim().toLowerCase()];
  return t ? t.replace(/\{(\d+)\}/g, (m, i) => nums[+i] ?? "#") : line;
}
function EN(id) { const e = G.entities[id]; if (!e) return ""; if (id.startsWith("node:")) return NN(id.slice(5), e.n); return T(e.n); }
let S = null;                 // server state
let base0 = null, prev = null; // stats at load, before last change
let override = {};            // port -> true/false set by the user (wire or switch)
let ORIG = {};                // the build's own PoB config at load
let prodAtLoad = new Set();   // ports that already had a producer at load
let lastSent = {};            // config values sent to PoB so far
let ghosts = [];              // switched-off cards kept on the canvas so they can be switched back on
let pos = {};
let selected = null;
let view = { x: 20, y: 20, k: 0.9 };
let tab = "port", portFilter = null;
// positions: automatic layout every render, except cards the user dragged (kept per build)
let dragged = {}, buildId = "";
const hashStr = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); };
function loadDragged(code) {
  buildId = hashStr(code || "");
  try { dragged = JSON.parse(localStorage.getItem("pob-drag:" + buildId) || "{}"); } catch (e) { dragged = {}; }
}
const savePos = () => { try { localStorage.setItem("pob-drag:" + buildId, JSON.stringify(dragged)); } catch (e) {} };

// ------------------------------------------------------------------ server
let queue = Promise.resolve();
function api(req) {
  const run = async () => {
    $("#busy").style.display = "block";
    try {
      const r = await fetch("/api", { method: "POST", body: JSON.stringify(req) });
      const j = await r.json();
      if (!j.ok) showMsg(j.error || "오류");
      else if (j.warnings && j.warnings.length) showMsg(j.warnings.join(" / "));
      return j;
    } finally { $("#busy").style.display = "none"; }
  };
  queue = queue.then(run, run);
  return queue;
}
function showMsg(t) { const m = $("#msg"); m.textContent = String(t).slice(0, 400); m.style.display = "block"; clearTimeout(showMsg.t); showMsg.t = setTimeout(() => m.style.display = "none", 6000); }

// ------------------------------------------------------------------ stats
const fmt = (v) => v == null ? "-" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.abs(v) >= 1e4 ? (v / 1e3).toFixed(1) + "k" : Math.round(v).toLocaleString();
function dps(s) { return s ? (s.CombinedDPS || s.MinionDPS || s.FullDPS || 0) : 0; }
function renderStats() {
  if (!S) return;
  const s = S.stats, defs = [
    ["주 스킬 초당 피해", dps], ["전체 초당 피해(Full)", (x) => x.FullDPS], ["유효 생명력(EHP)", (x) => x.TotalEHP], ["생명력", (x) => x.Life], ["에너지 보호막", (x) => x.EnergyShield],
    ["화염/냉기/번개 저항", (x) => x.FireResist, (x) => `${fmt(x.FireResist)}/${fmt(x.ColdResist)}/${fmt(x.LightningResist)}`],
    ["카오스 저항", (x) => x.ChaosResist], ["남은 정신력", (x) => x.SpiritUnreserved]];
  $("#stats").innerHTML = defs.map(([k, f, show]) => {
    const v = f(s), p = prev ? f(prev) : null, b = base0 ? f(base0) : null;
    const pct = (a, c) => (c && a != null) ? ((a - c) / Math.abs(c) * 100) : null;
    const d1 = pct(v, p), d0 = pct(v, b);
    const cls = (d) => d > 0.05 ? "up" : d < -0.05 ? "down" : "";
    const sgn = (d) => (d > 0 ? "+" : "") + d.toFixed(1) + "%";
    return `<div class="stat"><div class="k">${k}</div><div class="v">${show ? show(s) : fmt(v)}</div>
      <div class="d"><span class="${cls(d1)}" title="방금 바꾼 것">${d1 != null && Math.abs(d1) > 0.05 ? sgn(d1) : ""}</span>
      <span class="${cls(d0)} small" title="불러온 빌드 대비">${d0 != null && Math.abs(d0) > 0.05 ? " 원본 " + sgn(d0) : ""}</span></div></div>`;
  }).join("");
}

// ------------------------------------------------------------------ cards from state
const KCOL = { situation: "--warn", skill: "--skill", support: "--support", lineage: "--support", unique: "--unique", rare: "--rare", notable: "--passive", keystone: "--passive", ascendancy: "--asc" };
const KNAME = { global: "전역", situation: "상황", skill: "스킬", support: "보조", lineage: "혈통", unique: "고유", rare: "희귀", notable: "주요", keystone: "핵심", ascendancy: "전직" };
// ports of an item from its mod lines (rare items, or uniques missing from the graph)
function modEntity(mods) {
  const e = { in: [], out: [], ev: {}, st: [], src: {}, sc: {} };
  (mods || []).forEach((l) => {
    const m = (G.modPorts || {})[String(l).replace(/\{[^}]*\}/g, "").replace(NUMRX, "#").trim().toLowerCase()];
    if (!m) return;
    m.in.forEach((p) => { if (!e.in.includes(p)) { e.in.push(p); e.ev["in:" + p] = l; e.src["in:" + p] = m.src; } });
    m.out.forEach((p) => { if (!e.out.includes(p)) { e.out.push(p); e.ev["out:" + p] = l; e.src["out:" + p] = m.src; } });
    (m.st || []).forEach((p) => { if (!e.st.includes(p)) { e.st.push(p); e.ev["out:" + p] = l; e.src["out:" + p] = "pob"; } });
  });
  return e.in.length || e.out.length || e.st.length ? e : null;
}
function short(n) { return String(n || "").split(",")[0]; }
function cards() {
  const out = [];
  if (!S) return out;
  S.skills.forEach((g, gi) => {
    if (g.enabled === false) return;
    let active = null;
    g.gems.forEach((gem, j) => {
      const ent = G.entities["gem:" + gem.name];
      const kind = (G.gemKind && G.gemKind[gem.name]) || (ent ? ent.k : "skill");
      const key = `gem:${gi + 1}:${j + 1}:${gem.name}`;
      if (kind === "skill" && !active) active = key;
      out.push({ key, kind, name: T(gem.name), en: gem.name, ent, off: gem.enabled === false, gem: { group: gi + 1, idx: j + 1 }, col: 1, groupKey: () => active, label: g.label });
    });
  });
  S.items.forEach((it) => {
    if (it.slot.startsWith("Weapon 2 Swap") || it.slot.startsWith("Weapon 1 Swap")) return;
    const uniq = it.rarity === "UNIQUE";
    const nm = uniq ? short(it.name) : it.base;
    out.push({ key: "item:" + it.slot, kind: uniq ? "unique" : "rare", name: T(nm), en: nm, ent: (uniq && G.entities["unique:" + nm]) || modEntity(it.mods), slot: it.slot, mods: it.mods, col: 2 });
  });
  let normals = 0;
  S.nodes.forEach((n) => {
    const isAsc = !!n.asc;
    if (n.type === "Notable" || n.type === "Keystone" || (isAsc && n.type !== "Normal")) {
      out.push({ key: "node:" + n.id, kind: isAsc ? "ascendancy" : n.type === "Keystone" ? "keystone" : "notable", name: NN(n.id, n.name), ent: G.entities["node:" + n.id], node: n, col: isAsc ? 4 : 3 });
    } else normals++;
  });
  ghosts.forEach((g) => out.push({ ...g, off: true, ghost: true }));
  // virtual source for situational conditions (killed recently, been hit, moving...): switched on/off by hand
  const sit = new Set();
  out.forEach((c) => { if (c.ent && !c.off) c.ent.in.forEach((p) => { if (G.ports[p] && G.ports[p].common) sit.add(p); }); });
  if (sit.size) out.unshift({ key: "situation", kind: "situation", name: "전투 상황", ent: { in: [], out: [...sit], ev: {} }, col: 0, virtual: true });
  // global stats (crit chance, crit damage bonus, speed...): one card collects every source, they never feed mechanic ports
  const gst = [];
  out.forEach((c) => { if (c.ent && !c.off) (c.ent.st || []).forEach((p) => { if (!gst.includes(p)) gst.push(p); }); });
  if (gst.length) {
    const order = Object.keys(G.stats || {});
    gst.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    out.push({ key: "global", kind: "global", name: "전역 효과", ent: { in: gst, out: [], ev: {} }, col: 5, virtual: true });
  }
  cards.normals = normals;
  return out;
}
function portsOf(c) {
  const e = c.ent; if (!e) return { ins: [], outs: [] };
  const show = $("#showCommon").checked, stats = $("#showStats").checked, noGuess = $("#hideGuess").checked;
  const ok = (p, d) => G.ports[p] && (show || !G.ports[p].common) && !(noGuess && (e.src || {})[d + ":" + p] === "guess");
  if (c.kind === "global") return { ins: stats ? e.in : [], outs: [] };
  // a situational output nobody in the build uses is noise: hide it
  const outs = e.out.filter((p) => ok(p, "out") && (!G.ports[p].common || !CONSUMED || CONSUMED.has(p)));
  return { ins: e.in.filter((p) => ok(p, "in")), outs: stats ? outs.concat(e.st || []) : outs };
}

// ------------------------------------------------------------------ connection state
function portState(list) {
  const prod = {}, cons = {};
  list.forEach((c) => {
    if (c.off) return;
    const e = c.ent; if (!e) return;
    e.out.forEach((p) => (prod[p] = prod[p] || []).push(c));
    e.in.forEach((p) => (cons[p] = cons[p] || []).push(c));
  });
  const active = {};
  Object.keys(G.ports).forEach((p) => {
    const d = G.ports[p];
    if (!d.config || !Object.keys(d.config).length) { active[p] = !!prod[p]; return; }
    // default = the build's own PoB setting, so a freshly loaded build calculates exactly like PoB;
    // a producer added in the editor switches the port on; the user can override either way
    if (p in override) active[p] = override[p];
    else active[p] = origOn(p) || (!!prod[p] && !prodAtLoad.has(p));
  });
  return { prod, cons, active };
}
const truthy = (v) => v !== undefined && v !== null && v !== false && v !== 0 && v !== "";
function origOn(p) { const d = G.ports[p]; return !!d && Object.keys(d.config || {}).some((k) => truthy(ORIG[k])); }
function configFor(ps) {
  // only send what differs from the build's own setting (or undoes an earlier change)
  const want = {};
  Object.entries(G.ports).forEach(([p, d]) => {
    Object.entries(d.config || {}).forEach(([k, v]) => {
      const on = ps.active[p];
      let val;
      if (on === origOn(p)) val = ORIG[k];                      // untouched: PoB's own value
      else if (on) val = truthy(ORIG[k]) ? ORIG[k] : v;          // switched on
      else val = typeof v === "number" ? 0 : false;              // switched off
      if (k in want && truthy(want[k])) return;                  // a var shared by two ports stays on if either wants it
      want[k] = val;
    });
  });
  const cfg = {};
  Object.entries(want).forEach(([k, v]) => {
    const cur = k in lastSent ? lastSent[k] : ORIG[k];
    if (v === undefined) { if (truthy(cur)) cfg[k] = typeof cur === "number" ? 0 : false; }
    else if (v !== cur) cfg[k] = v;
  });
  Object.entries(cfg).forEach(([k, v]) => (lastSent[k] = v));
  return cfg;
}

// ------------------------------------------------------------------ render canvas

      const pct = (a, c) => c ? (a - c) / Math.abs(c) * 100 : 0;
      cycleValues[id] = { dps: pct(dps(r.state.stats), dps(s0)), ehp: pct(r.state.stats.TotalEHP, s0.TotalEHP) };
      S = r2.state;
    }
    render();
  }));
}
function applyView() { $("#world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }

// ------------------------------------------------------------------ right panel

      ${hasCfg ? `<button class="sw ${ps.active[p] ? "on" : ""}" data-port="${p}" title="${d.common ? "직접 켜고 끄는 흔한 조건" : "끄면 생산자가 있어도 없는 것으로 계산"}"></button>` : '<span class="small">표시만</span>'}</div>`;

function showDetail(c) {

// ------------------------------------------------------------------ actions
async function applyOps(ops) {
  prev = S ? S.stats : null;
  const list0 = cards();
  const r = await api({ op: "apply", ...ops, config: undefined });
  if (!r.ok) return;
  S = r.state;
  await syncConfig(false);
}
async function syncConfig(keepPrev) {
  const cfg = configFor(portState(cards()));
  if (Object.keys(cfg).length) {
    const r = await api({ op: "apply", config: cfg });
    if (r.ok) S = r.state;
  }
  render();
}
async function toggleCard(c) {
  if (c.gem && !c.ghost) { prev = S.stats; const r = await api({ op: "apply", toggleGem: { group: c.gem.group, gem: c.gem.idx, enabled: !!c.off } }); if (r.ok) S = r.state; return syncConfig(); }
  if (c.ghost) { ghosts = ghosts.filter((g) => g.key !== c.key); return addCard(c); }
  ghosts.push({ ...c, off: true });
  return removeCard(c, true);
}
async function removeCard(c, keepGhost) {
  if (c.ghost && !keepGhost) { ghosts = ghosts.filter((g) => g.key !== c.key); return render(); }
  prev = S.stats;
  let ops = {};
  if (c.gem) ops = { removeGem: { group: c.gem.group, gem: c.gem.idx } };
  else if (c.node) ops = { removeNodes: [c.node.id] };
  else if (c.slot) ops = { unequip: [c.slot] };
  const r = await api({ op: "apply", ...ops });
  if (r.ok) S = r.state;
  return syncConfig();
}
async function addCard(c) {
  prev = S.stats;
  let ops = {};
  if (c.node) ops = { addNodes: [c.node.id] };
  else if (c.kind === "unique") ops = { equip: [{ slot: c.slot, unique: c.name }] };
  else if (c.gem) ops = { addGem: { group: c.gem.group, name: c.name } };
  const r = await api({ op: "apply", ...ops });
  if (r.ok) S = r.state;
  return syncConfig();
}
function togglePort(p) {
  const d = G.ports[p];
  if (!d || !d.config || !Object.keys(d.config).length) return showMsg("이 연결은 PoB 설정이 없어 표시만 합니다.");
  prev = S.stats;
  const ps = portState(cards());
  override[p] = !ps.active[p];
  syncConfig();
}

// ------------------------------------------------------------------ drag / pan / zoom
function dragCard(ev, c, el) {
  if (ev.target.tagName === "BUTTON" || ev.target.classList.contains("dot") || ev.target.dataset.port) return;
  ev.stopPropagation();
  const sx = ev.clientX, sy = ev.clientY, p0 = { ...pos[c.key] };
  let moved = false;
  const mv = (e) => { moved = true; pos[c.key] = { x: p0.x + (e.clientX - sx) / view.k, y: p0.y + (e.clientY - sy) / view.k }; el.style.left = pos[c.key].x + "px"; el.style.top = pos[c.key].y + "px"; };
  const up = () => { window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); if (moved) { dragged[c.key] = pos[c.key]; savePos(); render(); } };
  window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
}
$("#canvas").addEventListener("mousedown", (ev) => {
  if (ev.target !== $("#canvas") && ev.target !== $("#world") && ev.target !== $("#wires")) return;
  const sx = ev.clientX, sy = ev.clientY, v0 = { ...view };
  const mv = (e) => { view.x = v0.x + e.clientX - sx; view.y = v0.y + e.clientY - sy; applyView(); };
  const up = () => { window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
});
$("#canvas").addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const r = $("#canvas").getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(2, Math.max(0.3, view.k * (ev.deltaY < 0 ? 1.1 : 0.9)));
  view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; applyView();
}, { passive: false });

// ------------------------------------------------------------------ palette
function setTab(t) { tab = t; document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t)); renderPalette(); }
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.t === "port") portFilter = portFilter; setTab(b.dataset.t); }));
const SLOTS = ["Helmet", "Body Armour", "Gloves", "Boots", "Amulet", "Ring 1", "Ring 2", "Belt", "Weapon 1", "Weapon 2"];
let palItems = [];
function candOf(it) {
  if (it.nodeId) return { addNodes: [it.nodeId] };
  if (it.unique) return { unique: it.unique, slot: it.slot };
  if (it.gemName) return { gem: it.gemName, group: gemTarget ? gemTarget.group : undefined };
  return null;
}
function paletteHtml(items, header) {
  palItems = items;
  return header + items.map((it, i) => `<div class="item"><div class="t"><span class="n">${esc(it.name)}</span><span class="kind" style="background:var(${KCOL[it.kind] || "--dim"})">${KNAME[it.kind] || it.kind}</span></div>
    ${it.sub ? `<div class="s">${esc(it.sub)}</div>` : ""}
    <div class="t" style="margin-top:4px"><span id="pv${i}" class="small">${candOf(it) ? "" : "미리보기 없음"}</span>${candOf(it) || it.addGroup ? `<button data-add="${i}">추가</button>` : ""}</div></div>`).join("");
}
async function runPreviews() {
  if (!S) return;
  const idx = palItems.map((it, i) => [i, candOf(it)]).filter(([, c]) => c).slice(0, 25);
  if (!idx.length) return;
  const snap = palItems;
  const r = await api({ op: "preview", candidates: idx.map(([, c]) => c) });
  if (!r.ok || snap !== palItems) return;
  idx.forEach(([i], j) => {
    const x = r.results[j], el = document.getElementById("pv" + i);
    if (!el || !x) return;
    if (!x.ok) { el.textContent = "계산 실패"; return; }
    const ch = (v, k) => v == null ? "" : `<span class="chip ${v > 0.05 ? "up" : v < -0.05 ? "down" : ""}">${k} ${(v > 0 ? "+" : "") + v.toFixed(1)}%</span>`;
    el.innerHTML = ch(x.dpsPct, "피해") + " " + ch(x.ehpPct, "생존") + (x.points ? ` <span class="small">${x.points}포인트</span>` : "");
  });
}
function bindAdd() {
  $("#palette").querySelectorAll("button[data-add]").forEach((b) => b.addEventListener("click", async () => {
    const it = palItems[+b.dataset.add];
    prev = S.stats;
    let ops = {};
    if (it.nodeId) ops = { addNodes: [it.nodeId] };
    else if (it.unique) ops = { equip: [{ slot: it.slot, unique: it.unique }] };
    else if (it.gemName) ops = { addGem: { name: it.gemName, group: gemTarget ? gemTarget.group : undefined } };
    else if (it.addGroup) ops = { addGroup: it.addGroup };
    const r = await api({ op: "apply", ...ops });
    if (r.ok) { S = r.state; await syncConfig(); runPreviews(); }
  }));
}
function slotForUnique(u) { return u.slot === "Ring 1" ? "Ring 1" : u.slot; }
let uniqCache = null, gemCache = null, gemTarget = null;
async function renderPalette() {
  const P = $("#palette");
  if (!S) { P.innerHTML = '<div class="small">먼저 빌드를 불러오세요.</div>'; return; }
  if (tab === "port") {
    const opts = Object.keys(G.ports).sort((a, b) => PN(a).localeCompare(PN(b), "ko")).map((k) => `<option value="${k}" ${portFilter && portFilter.port === k ? "selected" : ""}>${esc(PN(k))}</option>`).join("");
    const head = `<div class="row"><select id="pf"><option value="">연결 종류 선택…</option>${opts}</select><select id="pd"><option value="out" ${portFilter && portFilter.dir === "in" ? "selected" : ""}>만드는 것</option><option value="in" ${portFilter && portFilter.dir === "out" ? "selected" : ""}>쓰는 것</option></select></div>
      <div class="small" style="margin-bottom:6px">노드의 입력 칸을 누르면 그걸 만드는 요소가, 출력 칸을 누르면 그걸 쓰는 요소가 나옵니다.</div>`;
    let items = [];
    if (portFilter) {
      const want = portFilter.dir === "in" ? "out" : "in"; // clicked an input -> show producers
      const ascName = S.ascendancy;
      Object.entries(G.entities).forEach(([id, e]) => {
        if (!e[want].includes(portFilter.port)) return;
        const it = { name: EN(id), kind: e.k, sub: TL(e.ev[want + ":" + portFilter.port]) };
        if (id.startsWith("node:")) { if (e.k === "ascendancy") return; it.nodeId = +id.slice(5); }
        else if (id.startsWith("unique:")) { it.unique = e.n; }
        else if (e.k === "support" || e.k === "lineage") it.gemName = e.n;
        else if (e.k === "skill") it.addGroup = `${e.n} 20/0  1`;
        items.push(it);
      });
      const order = { notable: 0, keystone: 1, unique: 2, support: 3, lineage: 3, skill: 4 };
      items.sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
      items = items.slice(0, 60);
    }
    P.innerHTML = paletteHtml(items, head);
    $("#pf").addEventListener("change", (e) => { portFilter = e.target.value ? { port: e.target.value, dir: $("#pd").value === "out" ? "in" : "out" } : null; renderPalette(); });
    $("#pd").addEventListener("change", () => { if (portFilter) { portFilter.dir = $("#pd").value === "out" ? "in" : "out"; renderPalette(); } });
  } else if (tab === "passive") {
    P.innerHTML = `<div class="row"><input id="q" placeholder="이름이나 효과 (한글 또는 영문)"><button id="go">찾기</button></div><div id="res"></div>`;
    const go = async () => {
      const r = await api({ op: "findNodes", text: $("#q").value, limit: 40 });
      if (!r.ok) return;
      $("#res").innerHTML = paletteHtml(r.nodes.map((n) => { const k = KO.nodes[String(n.id)]; return { name: NN(n.id, n.name), kind: n.asc ? "ascendancy" : n.type === "Keystone" ? "keystone" : "notable", sub: (k && k.s.length ? k.s : (n.stats || []).map(TL)).join("\n") + `\n(${n.points ?? "?"}포인트)`, nodeId: n.id }; }), "");
      bindAdd(); runPreviews();
    };
    $("#go").addEventListener("click", go); $("#q").addEventListener("keydown", (e) => e.key === "Enter" && go());
    return;
  } else if (tab === "unique") {
    P.innerHTML = `<div class="row"><select id="slot">${SLOTS.map((s) => `<option value="${s}">${T(s)}</option>`).join("")}</select><input id="q" placeholder="이름 필터"></div><div id="res"></div>`;
    if (!uniqCache) { const r = await api({ op: "uniques" }); uniqCache = r.uniques || []; }
    const go = () => {
      const slot = $("#slot").value, q = $("#q").value.toLowerCase();
      const base = slot.replace(/ \d$/, "");
      const list = uniqCache.filter((u) => u.slot && (u.slot === slot || u.slot.replace(/ \d$/, "") === base || (base === "Weapon" && u.slot.startsWith("Weapon"))) && (u.name.toLowerCase().includes(q) || T(u.name).includes(q))).slice(0, 40);
      $("#res").innerHTML = paletteHtml(list.map((u) => { const e = G.entities["unique:" + u.name]; return { name: T(u.name), kind: "unique", sub: T(u.base) + (e ? "\n입력: " + e.in.map(PN).join(", ") + "\n출력: " + e.out.map(PN).join(", ") : ""), unique: u.name, slot }; }), "");
      bindAdd(); runPreviews();
    };
    $("#slot").addEventListener("change", go); $("#q").addEventListener("input", () => { clearTimeout(go.t); go.t = setTimeout(go, 300); });
    go(); return;
  } else if (tab === "gem") {
    P.innerHTML = `<div class="row"><input id="q" placeholder="보조젬 이름 필터"></div><div class="small" style="margin-bottom:6px">${gemTarget ? `넣을 곳: <b>${esc(gemTarget.name)}</b> <a href="#" id="gtReset">(주 스킬로)</a>` : "주 스킬 그룹에 넣었을 때 값. 스킬 카드의 빈 보조 칸을 누르면 그 스킬에 넣습니다."}</div><div id="res"></div>`;
    if (!gemCache) { const r = await api({ op: "gems", support: true }); gemCache = r.gems || []; }
    const go = () => {
      const q = $("#q").value.toLowerCase();
      const list = gemCache.filter((g) => g.name.toLowerCase().includes(q) || T(g.name).includes(q)).slice(0, 25);
      $("#res").innerHTML = paletteHtml(list.map((g) => { const e = G.entities["gem:" + g.name]; return { name: T(g.name), kind: g.lineage ? "lineage" : "support", sub: e ? ("입력: " + e.in.map(PN).join(", ") + "  출력: " + e.out.map(PN).join(", ")) : "", gemName: g.name }; }), "");
      bindAdd(); runPreviews();
    };
    $("#q").addEventListener("input", () => { clearTimeout(go.t); go.t = setTimeout(go, 400); });
    const gr = $("#gtReset"); if (gr) gr.addEventListener("click", (e) => { e.preventDefault(); gemTarget = null; renderPalette(); });
    go(); return;
  }
  bindAdd(); runPreviews();
}

// ------------------------------------------------------------------ load
async function loadBuild(code) {
  const r = await api({ op: "load", code: code.trim() });
  if (!r.ok) return;
  S = r.state; prev = null; override = {}; ghosts = []; selected = null; lastSent = {};
  loadDragged(code.trim());
  ORIG = { ...(S.config || {}) };
  prodAtLoad = new Set(Object.keys(portState(cards()).prod));
  base0 = S.stats;   // exactly PoB's numbers for this build
  renderMainSkill();
  render(); renderPalette();
}
function renderMainSkill() {
  const sel = $("#mainSkill");
  if (!S) { sel.innerHTML = ""; return; }
  sel.innerHTML = S.skills.map((g, i) => {
    const act = g.gems.filter((x) => !(G.entities["gem:" + x.name] && ["support", "lineage"].includes(G.entities["gem:" + x.name].k)));
    const nm = act.map((x) => T(x.name)).join(" / ") || g.label || ("그룹 " + (i + 1));

}
$("#mainSkill").addEventListener("change", async (e) => {

$("#hideBare").addEventListener("change", render);
$("#showStats").addEventListener("change", render);

$("#exportBtn").addEventListener("click", async () => { const r = await api({ op: "export" }); if (r.ok) { $("#export").value = r.code; $("#export").select(); } });
$("#examples").addEventListener("change", (e) => { if (e.target.value) { $("#code").value = e.target.value; loadBuild(e.target.value); } });

(async () => {
  G = await (await fetch("graph.json")).json();
  Object.entries(G.stats || {}).forEach(([k, kr]) => { G.ports[k] = { kr, common: false, config: {}, stat: true }; });

// ------------------------------------------------------------------ update
let UPD = { local: null, remote: null };
async function checkUpdate() {
  const btn = $("#updBtn");
  try {
    UPD.local = await (await fetch("version.json", { cache: "no-store" })).json();
    const cfg = await (await fetch("update.json", { cache: "no-store" })).json();
    const url = `https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch}/pob_calc/web/version.json?t=${Date.now()}`;
    UPD.remote = await (await fetch(url, { cache: "no-store" })).json();
    if ((UPD.remote.version || 0) > (UPD.local.version || 0)) {
      btn.classList.add("has");
      btn.textContent = `업데이트 있음 (v${UPD.remote.version})`;
      btn.title = `현재 v${UPD.local.version} → 새 버전 v${UPD.remote.version}\n${UPD.remote.notes || ""}`;
    } else {
      btn.classList.remove("has");
      btn.textContent = `업데이트 (v${UPD.local.version})`;
      btn.title = `최신 버전입니다 (v${UPD.local.version}). 눌러도 다시 받아서 적용합니다.`;
    }
  } catch (e) {
    btn.textContent = UPD.local ? `업데이트 (v${UPD.local.version})` : "업데이트";
    btn.title = "새 버전을 확인하지 못했습니다. 눌러서 바로 받아볼 수 있습니다.";
  }
}
$("#updBtn").addEventListener("click", async () => {
  const btn = $("#updBtn");
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "받는 중…";
  try {
    const r = await (await fetch("/api", { method: "POST", body: JSON.stringify({ op: "update" }) })).json();
    if (!r.ok || !r.updated) {
      showMsg("업데이트 실패: " + ((r.log || r.error || "").split("UPDATE_FAIL").pop().trim() || "알 수 없는 오류"));
      btn.disabled = false; checkUpdate(); return;
    }
    btn.textContent = "다시 시작하는 중…";
    try { sessionStorage.setItem("pob-reload-code", $("#code").value || ""); } catch (e) {}
    await new Promise((ok) => setTimeout(ok, 2500));
    for (let i = 0; i < 60; i++) {
      try { const t = await fetch("version.json", { cache: "no-store" }); if (t.ok) break; } catch (e) {}
      await new Promise((ok) => setTimeout(ok, 1000));
    }
    location.reload();
  } catch (e) {
    showMsg("업데이트 요청 실패: " + e.message);
    btn.disabled = false;
  }
});

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoB 노드 편집기</title>
<style>
:root {
  --bg: #0b0d10; --grid: #2a2c31; --panel: #12151a; --card: #1b1e23; --card-h: #23272e; --line: #2c313a;
  --text: #e6e8eb; --dim: #8a919c; --accent: #6aa3ff; --ok: #4cc38a; --bad: #ef6b6b; --warn: #e5b94e; --cut: #555b66;
  --skill: #6aa3ff; --support: #9b8cff; --unique: #e59b4e; --rare: #d8c25a; --passive: #4cc3b5; --asc: #e56ab4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
#top { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top textarea { width: 260px; height: 32px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; }
button, select, input { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
button:hover { background: var(--card-h); cursor: pointer; }
button.primary { background: #24406b; border-color: #335a95; }
#stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; min-width: 86px; }
.stat .k { color: var(--dim); font-size: 11px; }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 11px; font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: var(--bad); }
#main { display: grid; grid-template-columns: 300px 1fr 300px; min-height: 0; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; min-height: 0; }
#right { border-right: 0; border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.tabs button.on { background: #24406b; border-color: #335a95; }
.row { display: flex; gap: 4px; margin-bottom: 6px; }
.row > * { flex: 1; min-width: 0; }
.item { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px; margin-bottom: 6px; }
.item .t { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.item .n { font-weight: 600; }
.item .s { color: var(--dim); font-size: 11px; white-space: pre-line; margin-top: 2px; }
.chip { font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.kind { font-size: 10px; padding: 0 5px; border-radius: 3px; color: #000; font-weight: 600; }
#left { grid-column: 1; grid-row: 1; } #right { grid-column: 3; grid-row: 1; }
#treeView { grid-column: 2; grid-row: 1; position: relative; z-index: 5; display: none; background: #0d0f13; min-height: 0; overflow: hidden; }
#tsvg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
#tE1 path { stroke: #343a44; stroke-width: 10; fill: none; }
#tE2 path { stroke: #c9a24a; stroke-width: 18; fill: none; } #tE2 path.w1 { stroke: #e2685f; } #tE2 path.w2 { stroke: #58c27d; }
.tn { fill: #262a31; stroke: #5a616c; stroke-width: 6; cursor: pointer; }
.tn:hover { stroke: #fff; }
.tn.Notable { stroke: #b89a55; stroke-width: 9; } .tn.Keystone { stroke: #c77bd6; stroke-width: 12; } .tn.Socket { stroke: #6aa3ff; stroke-width: 9; }
.tn.ClassStart { fill: #15171b; stroke: #777; } .tn.attr { fill: #20242a; }
.tn.on { fill: #d8b04c; } .tn.on.w1 { fill: #e2685f; } .tn.on.w2 { fill: #58c27d; } .tn.on.Keystone { fill: #c77bd6; }
.tn.hit { stroke: #fff36b; stroke-width: 22; }
#tL text { display: none; fill: #b9bfc8; font-size: 34px; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #0d0f13; stroke-width: 8px; }
#tL text.on { fill: #f0d27a; } #tsvg.near #tL text { display: block; }
#tHov circle { fill: none; stroke-width: 12; pointer-events: none; } #tHov .add { stroke: #6ad7ff; } #tHov .rm { stroke: #ff5a5a; }
#tPanel { position: absolute; left: 10px; top: 10px; width: 300px; max-height: calc(100% - 20px); overflow: auto; background: #12151af2; border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#tPanel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#tPanel #tSum div { padding: 1px 0; border-bottom: 1px solid #1d2128; }
#canvas { position: relative; overflow: hidden; cursor: grab; min-height: 0;
  background-color: #1e1f22;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke-width: 2; pointer-events: stroke; cursor: pointer; }
.card { position: absolute; background: #24272d; border: 1px solid #0e0f12; border-radius: 6px; user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,.55); }
.card.pill { border-radius: 16px; }
.card.off { opacity: .4; }
.card.sel { outline: 3px solid #ff5a3d; outline-offset: 1px; }
.card.dim { opacity: .12; } .card.pot { opacity: .45; outline: 2px dashed #8a919c; outline-offset: 2px; } .card.ind { opacity: .55; filter: saturate(.6); }
#skillBox { display: none; background: #171b22; border: 1px solid #335a95; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
#skillBox .kv { display: flex; justify-content: space-between; gap: 8px; } #skillBox .kv span:last-child { font-variant-numeric: tabular-nums; }
.card.newc { box-shadow: 0 0 0 3px #3dff9a, 0 0 18px 4px rgba(61,255,154,.55); }
.card.newc .h::after { content: "새로"; font-size: 10px; font-weight: 700; color: #0b2; background: #3dff9a; color: #062; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.card.gonec { box-shadow: 0 0 0 3px #ff5a5a, 0 0 18px 4px rgba(255,90,90,.5); }
.card.gonec .h::after { content: "최적화로 빠짐"; font-size: 10px; font-weight: 700; background: #ff5a5a; color: #300; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.sgem.gonec { background: rgba(255,90,90,.18); box-shadow: inset 3px 0 0 #ff5a5a; }
#cmpBar { display: none; gap: 4px; align-items: center; padding: 2px 6px; border: 1px solid #3dff9a; border-radius: 6px; }
#cmpBar button.on { background: #1f5c3c; border-color: #3dff9a; }
#tCmp circle { fill: none; stroke-width: 16; pointer-events: none; } #tCmp .add { stroke: #3dff9a; } #tCmp .rm { stroke: #ff5a5a; stroke-dasharray: 30 18; }
.sgem.newc { background: rgba(61,255,154,.18); box-shadow: inset 3px 0 0 #3dff9a; }
.prob { color: #ff7a6b; font-size: 11px; margin-top: 3px; }
.item.bad { opacity: .55; }
.colh { position: absolute; white-space: nowrap; font-size: 13px; font-weight: 700; color: #cfd6df; cursor: pointer; user-select: none; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.06); }
.colh span { font-size: 10px; font-weight: 400; color: #8a94a0; margin-left: 4px; } .colh:hover { background: rgba(255,255,255,.12); }
.cb { font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 6px; background: rgba(0,0,0,.35); white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.cb.dn { color: #ff8a7a; } .cb.up { color: #7ee08a; } .cb.eh.dn { color: #ffb36b; } .cb.eh.up { color: #7fc8ff; } .cb.z { color: #888; font-weight: 400; }
.card.off.dim { opacity: .15; }
.stl { font-size: 10px; color: #8fa3bf; padding: 0 12px; height: 18px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid rgba(255,255,255,.05); }
.prow[data-stat] { cursor: pointer; } .prow.on { background: rgba(143,163,191,.18); }
.card .h { display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: move; border-radius: 6px 6px 0 0; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.card .h.pillh { border-radius: 16px; padding: 0 12px; }
.card .h .glyph { font-weight: 700; opacity: .9; }
.card .h .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.card .h .tag { font-size: 10px; opacity: .75; white-space: nowrap; max-width: 52px; overflow: hidden; text-overflow: ellipsis; }
.card .h button { padding: 0 4px; font-size: 10px; background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.15); color: #fff; }
.ports { position: relative; padding-bottom: 4px; }
.socks { padding-top: 3px; border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 3px; }
.srow { font-size: 11px; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow.empty { color: #666; cursor: pointer; font-style: italic; }
.sgem { position: relative; font-size: 11px; border-top: 1px solid rgba(255,255,255,.05); }
.sgem.off { opacity: .45; }
.sgem .gc { position: absolute; left: 50%; transform: translateX(-50%); top: 0; display: flex; align-items: center; gap: 3px; max-width: 40%; }
.sgem .gn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.sgem.selg .gn { text-decoration: underline; }
.sgem .gb { display: flex; gap: 1px; flex: none; }
.sgem .gb button { padding: 0 3px; font-size: 9px; line-height: 14px; background: rgba(0,0,0,.3); border-color: rgba(255,255,255,.12); color: #ccc; }
.sgem .pl, .sgem .pr { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 29%; cursor: pointer; }
.sgem .pl { left: 12px; } .sgem .pr { right: 12px; text-align: right; }
.srow.empty:hover { color: #aaa; }
.dot.guess { border-style: dashed; background: transparent !important; }
.dot.local { border-radius: 2px; transform: rotate(45deg) scale(.85); }
.selfmark { font-style: normal; font-size: 9px; color: #ddd; background: rgba(255,255,255,.12); border-radius: 3px; padding: 0 3px; margin-left: 3px; }
.dot.sock { border-radius: 3px; cursor: pointer; }
.prow { display: flex; justify-content: space-between; font-size: 11px; padding: 0 12px; }
.prow span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 62%; cursor: pointer; }
.prow span:hover { text-decoration: underline; }
.dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid; cursor: crosshair; box-sizing: border-box; }
.small { color: var(--dim); font-size: 11px; }
h3 { margin: 10px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.portrow { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.portrow .pn { flex: 1; }
.sw { width: 34px; height: 18px; border-radius: 9px; background: var(--cut); position: relative; cursor: pointer; border: 0; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .12s; }
.sw.on { background: var(--ok); } .sw.on::after { left: 18px; }
#busy { position: fixed; right: 12px; bottom: 10px; background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 6px; display: none; }
#msg { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: #3a1e1e; border: 1px solid #6b2c2c; padding: 6px 12px; border-radius: 6px; display: none; max-width: 70vw; }
#updBtn.has { background: #2e7d32; border-color: #4caf50; color: #fff; animation: updPulse 1.6s ease-in-out infinite; }
@keyframes updPulse { 50% { box-shadow: 0 0 10px #4caf50; } }
#export { width: 100%; height: 60px; font-size: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
#tip{position:fixed;z-index:9999;max-width:380px;background:#14161c;border:1px solid #6a5a35;border-radius:6px;padding:8px 10px;color:#ddd;font-size:12px;line-height:1.45;pointer-events:none;display:none;box-shadow:0 4px 16px #0008;white-space:pre-wrap}
#tip b{color:#e6c97a;font-size:13px}#tip .p{color:#9aa}#tip .d{color:#bbb;margin:4px 0;font-style:italic}#tip .q{color:#7fb3ff}#tip .st{color:#e0a060;margin-top:4px}
[data-gem]{cursor:help}
</style>
</head>
<body>
<div id="tip"></div>
<div id="app">
  <div id="top">
    <strong>PoB 노드 편집기</strong>
    <select id="examples"><option value="">예시 빌드…</option></select>
    <select id="mainSkill" title="주 스킬 (PoB의 주 스킬 선택과 같음)"></select>
    <textarea id="code" placeholder="PoB 빌드 코드 붙여넣기"></textarea>
    <button class="primary" id="load">불러오기</button>
    <label class="small"><input type="checkbox" id="showCommon" checked> 상황 조건도 표시</label>
    <label class="small" title="꺼 두면 선은 흐리게만 보이고, 카드를 누르면 그 카드와 이어진 경로만 진하게 보입니다"><input type="checkbox" id="allWires"> 선 진하게</label>
    <label class="small"><input type="checkbox" id="hideBare" checked> 연결 없는 카드 숨기기</label>
    <label class="small" title="치명타 확률, 치명타 피해 보너스, 속도처럼 전체에 적용되는 능력치를 '전역 효과' 카드로 모아 봅니다"><input type="checkbox" id="showStats" checked> 전역 효과</label>
    <label class="small" title="PoB가 해석하지 못한 문장에서 단어로 읽은 연결(점선)을 숨깁니다"><input type="checkbox" id="hideGuess"> 추정 연결 숨기기</label><span class="small" id="hiddenInfo"></span>
    <span id="cmpBar" title="최적화 전과 후의 빌드를 번갈아 불러와 비교합니다. 후에서는 새로 들어온 것이 초록, 전에서는 빠질 것이 빨강으로 보여요">최적화 <button data-v="before">전</button><button data-v="after">후</button></span>
    <button id="treeBtn" title="poe2db처럼 전체 패시브 트리를 보고 직접 찍습니다. 찍을 때마다 PoB가 다시 계산합니다">패시브 트리</button>
    <button id="updBtn" title="새 버전이 있으면 받아서 바로 적용합니다">업데이트</button>
    <div id="stats"></div>
  </div>
  <div id="main">
    <div class="side" id="left">
      <div class="tabs" id="tabs">
        <button data-t="port" class="on">연결</button><button data-t="passive">패시브</button><button data-t="unique">고유템</button><button data-t="gem">보조젬</button><button data-t="loop">고리 찾기</button><button data-t="opt">최적화</button>
      </div>
      <div id="palette"></div>
    </div>
    <div id="treeView"><svg id="tsvg"><g id="tE1"></g><g id="tE2"></g><g id="tHov"></g><g id="tCmp"></g><g id="tN"></g><g id="tL"></g></svg>
      <div id="tPanel">
        <div class="row"><b style="white-space:nowrap">패시브 트리</b><span style="flex:1"></span><button id="tFit" title="전체 보기">전체</button><button id="tClose">닫기</button></div>
        <input id="tSearch" placeholder="검색 (예: 치명타, 냉기, 정신력)"><span id="tHits" class="small"></span>
        <div id="tPoints" class="small"></div>
        <div class="row small">찍을 곳 <select id="tMode"><option value="0">일반</option><option value="1">무기 세트 1</option><option value="2">무기 세트 2</option></select>
          속성 노드 <select id="tAttr"><option value="1">힘</option><option value="2">민첩</option><option value="3">지능</option></select></div>
        <div class="small" style="color:var(--dim)">누르면 찍기·빼기 (PoB와 같은 경로). 마우스를 올리면 PoB가 계산한 변화가 보여요. 찍은 속성 노드는 오른쪽 클릭으로 바꿔요. 휠로 확대, 끌어서 이동.</div>
        <details open><summary class="small">찍은 능력치 합계</summary><div id="tSum" class="small"></div></details>
      </div>
    </div>
    <div id="canvas" style="grid-column:2;grid-row:1"><div id="world"><svg id="wires"></svg></div></div>
    <div class="side" id="right">
      <div id="skillBox"></div>
      <h3>연결 상태</h3>
      <div class="small">선 = PoB 설정. 생산자가 있으면 켜지고, 끄면 그 조건이 없는 상태로 계산합니다.</div>
      <div id="portList"></div>
      <h3>순환 고리</h3>
      <div id="cycles" class="small"></div>
      <h3>선택한 노드</h3>
      <div id="detail" class="small">노드를 누르면 내용이 보입니다.</div>
      <h3>내보내기</h3>
      <button id="exportBtn">PoB 코드 만들기</button>
      <textarea id="export" readonly></textarea>
    </div>
  </div>
</div>
<div id="busy">계산 중…</div>
<div id="msg"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const W = 240, ROW = 18, HEAD = 34;
let G = { ports: {}, entities: {} };
let KO = { names: {}, nodes: {}, uniq: {}, tmpl: {}, ports: {} };
const NUMRX = /\(?-?\d+(?:\.\d+)?(?:[—\-–]\d+(?:\.\d+)?)?\)?/g;
function T(en) {
  if (!en) return "";
  if (KO.names[en]) return KO.names[en];
  const m = /^(Jewel|Charm|Flask) ?(\d*)$/.exec(en);
  if (m) return ({ Jewel: "주얼", Charm: "호신부", Flask: "플라스크" })[m[1]] + (m[2] ? " " + m[2] : "");
  return en;
}                  // name -> Korean client name
function PN(p) { return KO.ports[p] || (G.ports[p] && G.ports[p].kr) || p; } // port -> Korean term
function NN(id, en) { const n = KO.nodes[String(id)]; return n ? n.n : T(en); }
function TL(line) {                                                            // one mod line -> Korean
  if (!line) return "";
  const nums = line.match(NUMRX) || [];
  const t = KO.tmpl[line.replace(NUMRX, "#").trim().toLowerCase()];
  return t ? t.replace(/\{(\d+)\}/g, (m, i) => nums[+i] ?? "#") : line;
}
function EN(id) { const e = G.entities[id]; if (!e) return ""; if (id.startsWith("node:")) return NN(id.slice(5), e.n); return T(e.n); }
let S = null;                 // server state
let base0 = null, prev = null; // stats at load, before last change
let override = {};            // port -> true/false set by the user (wire or switch)
let ORIG = {};                // the build's own PoB config at load
let prodAtLoad = new Set();   // ports that already had a producer at load
let lastSent = {};            // config values sent to PoB so far
let ghosts = [];              // switched-off cards kept on the canvas so they can be switched back on
let pos = {};
let selected = null;
let view = { x: 20, y: 20, k: 0.9 };
let tab = "port", portFilter = null;
// positions: automatic layout every render, except cards the user dragged (kept per build)
let dragged = {}, buildId = "";
const hashStr = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); };
function loadDragged(code) {
  buildId = hashStr(code || "");
  try { dragged = JSON.parse(localStorage.getItem("pob-drag:" + buildId) || "{}"); } catch (e) { dragged = {}; }
}
const savePos = () => { try { localStorage.setItem("pob-drag:" + buildId, JSON.stringify(dragged)); } catch (e) {} };

// ------------------------------------------------------------------ server
let queue = Promise.resolve();
function api(req, quiet) {
  const run = async () => {
    if (!quiet) $("#busy").style.display = "block";
    try {
      const r = await fetch("/api", { method: "POST", body: JSON.stringify(req) });
      const j = await r.json();
      if (!j.ok) showMsg(j.error || "오류");
      else if (j.warnings && j.warnings.length) showMsg(j.warnings.join(" / "));
      return j;
    } finally { if (!quiet) $("#busy").style.display = "none"; }
  };
  queue = queue.then(run, run);

    $("#pf").addEventListener("change", (e) => { portFilter = e.target.value ? { port: e.target.value, dir: $("#pd").value === "out" ? "in" : "out" } : null; renderPalette(); });
    $("#pd").addEventListener("change", () => { if (portFilter) { portFilter.dir = $("#pd").value === "out" ? "in" : "out"; renderPalette(); } });
  } else if (tab === "passive") {
    P.innerHTML = `<div class="row"><input id="q" placeholder="이름이나 효과 (한글 또는 영문)"><button id="go">찾기</button></div><div id="res"></div>`;
    const go = async () => {
      const r = await api({ op: "findNodes", text: $("#q").value, limit: 40 });
      if (!r.ok) return;
      $("#res").innerHTML = paletteHtml(r.nodes.map((n) => { const k = KO.nodes[String(n.id)]; return { name: NN(n.id, n.name), kind: n.asc ? "ascendancy" : n.type === "Keystone" ? "keystone" : "notable", sub: (k && k.s.length ? k.s : (n.stats || []).map(TL)).join("\n") + `\n(${n.points ?? "?"}포인트)`, nodeId: n.id }; }), "");
      bindAdd(); runPreviews();
    };
    $("#go").addEventListener("click", go); $("#q").addEventListener("keydown", (e) => e.key === "Enter" && go());
    return;
  } else if (tab === "unique") {
    P.innerHTML = `<div class="row"><select id="slot">${SLOTS.map((s) => `<option value="${s}">${T(s)}</option>`).join("")}</select><input id="q" placeholder="이름 필터"></div><div id="res"></div>`;
    if (!uniqCache) { const r = await api({ op: "uniques" }); uniqCache = r.uniques || []; }
    const go = () => {
      const slot = $("#slot").value, q = $("#q").value.toLowerCase();
      const base = slot.replace(/ \d$/, "");
      const list = uniqCache.filter((u) => u.slot && (u.slot === slot || u.slot.replace(/ \d$/, "") === base || (base === "Weapon" && u.slot.startsWith("Weapon"))) && (u.name.toLowerCase().includes(q) || T(u.name).includes(q))).slice(0, 40);
      $("#res").innerHTML = paletteHtml(list.map((u) => { const e = G.entities["unique:" + u.name]; return { name: T(u.name), kind: "unique", sub: T(u.base) + (e ? "\n입력: " + e.in.map(PN).join(", ") + "\n출력: " + e.out.map(PN).join(", ") : ""), unique: u.name, slot }; }), "");
      bindAdd(); runPreviews();
    };
    $("#slot").addEventListener("change", go); $("#q").addEventListener("input", () => { clearTimeout(go.t); go.t = setTimeout(go, 300); });
    go(); return;
  } else if (tab === "gem") {
    const gi = gemTarget ? gemTarget.group : S.mainGroup;
    const gname = gemTarget ? gemTarget.name : "주 스킬";
    P.innerHTML = `<div class="row"><input id="q" placeholder="보조젬 이름 필터"></div><div class="small" style="margin-bottom:6px">넣을 곳: <b>${esc(gname)}</b>${gemTarget ? ' <a href="#" id="gtReset">(주 스킬로)</a>' : ""}<br>이 스킬에 꽂을 수 있는 보조젬 전부, 넣었을 때 피해 변화 순. 빈 보조 칸을 누르면 그 스킬로 바뀝니다.</div><div id="res"><div class="small">계산 중… (보조젬마다 PoB로 한 번씩 계산합니다)</div></div>`;
    const gr = $("#gtReset"); if (gr) gr.addEventListener("click", (e) => { e.preventDefault(); gemTarget = null; renderPalette(); });
    const key = gi + "|" + JSON.stringify(S.stats);
    if (!supCache || supCache.key !== key) {
      const r = await api({ op: "supportOptions", group: gi });
      if (!r.ok || tab !== "gem") return;
      supCache = { key, r };
    }
    const R = supCache.r;
    const sk = R.skillDPS ? "skillPct" : "mainPct";
    const bad = (o) => (o.problems ? 1 : 0);
    const opts = R.options.slice().sort((a, b) => bad(a) - bad(b) || (b[sk] ?? -1e9) - (a[sk] ?? -1e9) || (b.mainPct ?? 0) - (a.mainPct ?? 0) || (b.ehpPct ?? 0) - (a.ehpPct ?? 0));
    const ch = (v, k) => v == null ? "" : `<span class="chip ${v > 0.05 ? "up" : v < -0.05 ? "down" : ""}">${k} ${(v > 0 ? "+" : "") + v.toFixed(1)}%</span>`;
    const go = () => {
      const q = $("#q").value.toLowerCase();
      const list = opts.filter((o) => o.name.toLowerCase().includes(q) || T(o.name).includes(q));
      palItems = list.map((o) => ({ gemName: o.name }));
      $("#res").innerHTML = `<div class="small" style="margin-bottom:4px">${list.length}개${R.skillDPS ? "" : " · 이 스킬은 자체 피해가 없어 주 스킬 피해로 봅니다"}${R.supports >= R.maxSupports ? `<div class="prob">보조 칸 ${R.supports}/${R.maxSupports} 가득: 넣으려면 먼저 하나를 빼야 해요. 아래 값은 빼지 않고 더했을 때예요.</div>` : ` · 보조 칸 ${R.supports}/${R.maxSupports}`}</div>` + list.map((o, i) => {
        const e = G.entities["gem:" + o.name];
        const io = e ? "입력: " + (e.in.map(PN).join(", ") || "없음") + "  출력: " + (e.out.map(PN).join(", ") || "없음") : "";
        const chips = (R.skillDPS ? ch(o.skillPct, "이 스킬 피해") : "") + (!R.isMain || !R.skillDPS ? " " + ch(o.mainPct, "주 스킬 피해") : "") + (o.ehpPct && Math.abs(o.ehpPct) > 0.05 ? " " + ch(o.ehpPct, "생존") : "");
        return `<div class="item ${o.problems ? "bad" : ""}"><div class="t"><span class="n"${gemAttr(o.name)}>${esc(T(o.name))}</span><span class="kind" style="background:var(${KCOL[o.lineage ? "lineage" : "support"] || "--dim"})">${KNAME[o.lineage ? "lineage" : "support"]}</span></div>
          ${io ? `<div class="s">${esc(io)}</div>` : ""}<div class="t" style="margin-top:4px"><span class="small">${o.ok ? chips : "계산 실패"}</span><button data-add="${i}">${o.problems ? "그래도 장착" : "장착"}</button></div>${probHtml(o)}</div>`;
      }).join("");
      $("#res").querySelectorAll("button[data-add]").forEach((b) => b.addEventListener("click", async () => {
        prev = S.stats;
        const snap0 = snapIds();
        const r = await api({ op: "apply", addGem: { name: list[+b.dataset.add].gemName || list[+b.dataset.add].name, group: gi } });
        if (r.ok) { S = r.state; await syncConfig(); markNew(snap0); renderPalette(); }
      }));
    };
    $("#q").addEventListener("input", () => { clearTimeout(go.t); go.t = setTimeout(go, 200); });
    go(); return;
  }
  bindAdd(); runPreviews();
}

// ------------------------------------------------------------------ load
async function loadBuild(code) {
  const r = await api({ op: "load", code: code.trim() });
  if (!r.ok) return;
  S = r.state; prev = null; override = {}; ghosts = []; selected = null; lastSent = {};
  TREE = null; treeS = null;   // another build can be on another tree version
  optCmp = null; GONEC = new Set(); updCmpBar();
  loadDragged(code.trim());
  ORIG = { ...(S.config || {}) };
  prodAtLoad = new Set(Object.keys(portState(cards()).prod));
  base0 = S.stats;   // exactly PoB's numbers for this build
  renderMainSkill();
  render(); renderPalette();
}
function renderMainSkill() {
  const sel = $("#mainSkill");
  if (!S) { sel.innerHTML = ""; return; }
  sel.innerHTML = S.skills.map((g, i) => {
    const act = g.gems.filter((x) => !(G.entities["gem:" + x.name] && ["support", "lineage"].includes(G.entities["gem:" + x.name].k)));
    const nm = act.map((x) => T(x.name)).join(" / ") || g.label || ("그룹 " + (i + 1));
    return `<option value="${i + 1}" ${S.mainGroup === i + 1 ? "selected" : ""}>${esc(nm)}${g.enabled === false ? " (꺼짐)" : ""}</option>`;
  }).join("");
}
$("#mainSkill").addEventListener("change", async (e) => {
  prev = S.stats;
  const r = await api({ op: "apply", mainSkill: +e.target.value });
  if (r.ok) { S = r.state; base0 = S.stats; render(); }
});
$("#load").addEventListener("click", () => loadBuild($("#code").value));
$("#showCommon").addEventListener("change", render);
$("#hideBare").addEventListener("change", render);
$("#showStats").addEventListener("change", render);
$("#hideGuess").addEventListener("change", render);
$("#allWires").addEventListener("change", render);
$("#exportBtn").addEventListener("click", async () => { const r = await api({ op: "export" }); if (r.ok) { $("#export").value = r.code; $("#export").select(); } });
$("#examples").addEventListener("change", (e) => { if (e.target.value) { $("#code").value = e.target.value; loadBuild(e.target.value); } });

let TIPS = {};
function gemAttr(en) { return en && TIPS[en] ? ` data-gem="${esc(en)}"` : ""; }
document.addEventListener("mouseover", (ev) => {
  if (ev.target.closest && ev.target.closest("#tsvg")) return;   // the passive tree runs its own tooltip
  const t = ev.target.closest && ev.target.closest("[data-gem]"); const tip = $("#tip");
  if (!t) { tip.style.display = "none"; return; }
  const d = TIPS[t.dataset.gem]; if (!d) return;
  let h = `<b>${esc(T(t.dataset.gem))}</b>`;
  if (d.p && d.p.length) h += `<div class="p">${d.p.map(esc).join("\n")}</div>`;
  if (d.d) h += `<div class="d">${esc(d.d)}</div>`;
  (d.s || []).forEach(([title, lines]) => { if (title) h += `<div class="st">${esc(title)}</div>`; lines.forEach((l) => { h += `<div class="${l.startsWith("◆") ? "q" : ""}">${esc(l)}</div>`; }); });
  tip.innerHTML = h; tip.style.display = "block";
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = r.left, y = r.bottom + 6; if (x + w > innerWidth - 8) x = innerWidth - w - 8; if (y + hh > innerHeight - 8) y = Math.max(8, r.top - hh - 6);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
(async () => {
  G = await (await fetch("graph.json")).json();
  Object.entries(G.stats || {}).forEach(([k, kr]) => { G.ports[k] = { kr, common: false, config: {}, stat: true }; });
  try { KO = await (await fetch("ko.json")).json(); } catch (e) {}
  try { TIPS = await (await fetch("gem_tips.json")).json(); } catch (e) {}
  try {
    const ex = await (await fetch("examples.json")).json();
    $("#examples").innerHTML += ex.map((x) => `<option value="${esc(x.code)}">${esc(x.name)}</option>`).join("");
  } catch (e) {}
  renderPalette();
  initTree();
  $("#cmpBar").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-v]"); if (b) cmpShow(b.dataset.v); });
  checkUpdate();
  setInterval(checkUpdate, 30 * 60 * 1000);
  let again = null;
  try { again = sessionStorage.getItem("pob-reload-code"); sessionStorage.removeItem("pob-reload-code"); } catch (e) {}
  if (again) { $("#code").value = again; loadBuild(again); }
})();

// ------------------------------------------------------------------ update
let UPD = { local: null, remote: null };
async function checkUpdate() {
  const btn = $("#updBtn");
  try {
    UPD.local = await (await fetch("version.json", { cache: "no-store" })).json();
    const cfg = await (await fetch("update.json", { cache: "no-store" })).json();
    const url = `https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch}/pob_calc/web/version.json?t=${Date.now()}`;
    UPD.remote = await (await fetch(url, { cache: "no-store" })).json();
    if ((UPD.remote.version || 0) > (UPD.local.version || 0)) {
      btn.classList.add("has");
      btn.textContent = `업데이트 있음 (v${UPD.remote.version})`;
      btn.title = `현재 v${UPD.local.version} → 새 버전 v${UPD.remote.version}\n${UPD.remote.notes || ""}`;
    } else {
      btn.classList.remove("has");
      btn.textContent = `업데이트 (v${UPD.local.version})`;
      btn.title = `최신 버전입니다 (v${UPD.local.version}). 눌러도 다시 받아서 적용합니다.`;
    }
  } catch (e) {
    btn.textContent = UPD.local ? `업데이트 (v${UPD.local.version})` : "업데이트";
    btn.title = "새 버전을 확인하지 못했습니다. 눌러서 바로 받아볼 수 있습니다.";
  }
}
$("#updBtn").addEventListener("click", async () => {
  const btn = $("#updBtn");
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "받는 중…";
  try {
    const r = await (await fetch("/api", { method: "POST", body: JSON.stringify({ op: "update" }) })).json();
    if (!r.ok || !r.updated) {
      showMsg("업데이트 실패: " + ((r.log || r.error || "").split("UPDATE_FAIL").pop().trim() || "알 수 없는 오류"));
      btn.disabled = false; checkUpdate(); return;
    }
    btn.textContent = "다시 시작하는 중…";
    try { sessionStorage.setItem("pob-reload-code", $("#code").value || ""); } catch (e) {}
    await new Promise((ok) => setTimeout(ok, 2500));
    for (let i = 0; i < 60; i++) {
      try { const t = await fetch("version.json", { cache: "no-store" }); if (t.ok) break; } catch (e) {}
      await new Promise((ok) => setTimeout(ok, 1000));
    }
    location.reload();
  } catch (e) {
    showMsg("업데이트 요청 실패: " + e.message);
    btn.disabled = false;
  }
});
</script>
